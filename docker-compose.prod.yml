# Server deployment: pulls the published image instead of building it.
# This is the only file you need on the server -- no checkout required.
#
#   mkdir arks-arcade && cd arks-arcade
#   curl -O <raw url of this file>          # or just paste it
#   cp .env.example .env && edit it
#   docker compose pull && docker compose up -d
#
# TZ matters: daily challenges and streaks roll over at local midnight.

services:
  arks-arcade:
    image: ghcr.io/destynnreigneer/arks-arcade:latest
    container_name: arks-arcade
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - ARCADE_NAME=${ARCADE_NAME:-}
      - TRIVIA_ONLINE=${TRIVIA_ONLINE:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ADULT_PIN=${ADULT_PIN}
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
