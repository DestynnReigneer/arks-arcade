version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR a week rather than five, so reviewing them stays a five-minute
      # job instead of something you start ignoring.
      all-npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      # Weekly, so a Node security release reaches a PR within days.
      interval: weekly
    ignore:
      # The arcade stays on Node 22 (long-term support) like the other ARKS
      # apps; moving to a new line is its own PR. Patch and minor updates of
      # the pinned node:22.x-alpine still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
