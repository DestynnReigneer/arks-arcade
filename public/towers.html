<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Defense</title>
<link rel="icon" href="/custom/brand/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/custom/brand/app-icon-180.png">
<link rel="stylesheet" href="arcade-ui.css">
<link rel="stylesheet" href="game-shell.css">
<link rel="stylesheet" href="tutorial.css">
<link rel="stylesheet" href="look.css">
<link rel="stylesheet" href="topbar.css">
<link rel="stylesheet" href="end-window.css">
<link rel="stylesheet" href="tv.css">
<link rel="stylesheet" href="tv-play.css">
<!-- On a TV: the TV layout, the remote and a game controller (tv.js, tv-play.js). -->
<script src="tv-core.js"></script>
<script src="tv.js"></script>
<script src="tv-play.js"></script>
<style>
  :root { --accent: #ffc72c; --on-accent: #1a0f05; --pick: #00ffc2; }
  .stage { cursor: pointer; }
  body.td-armed .stage { cursor: crosshair; }
  .wave-bar { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
  .wave-bar .primary { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.15; position: relative; overflow: hidden; }
  .wave-bar .primary small { font-size: 11.5px; font-weight: 600; opacity: 0.85; }
  .wave-bar .primary .timer { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.35); transition: width 0.2s linear; }
  .speed { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .speed small { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .speed div { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .speed button { width: 36px; height: 36px; border: 0; background: var(--card); color: var(--text); font-size: 20px; font-weight: 800; cursor: pointer; }
  .speed button:disabled { opacity: 0.35; cursor: default; }
  .speed b { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; color: var(--accent); }
  .next-up { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 22px; }
  .next-up span { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
  .map-grid button {
    padding: 7px 4px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; line-height: 1.2;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
  }
  .map-grid button small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .map-grid button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
  .lvl-easy { color: #3ddc84; } .lvl-medium { color: #ffc72c; } .lvl-hard { color: #ff5e5e; }

  /* The build bar: every tower, all the time. One you can pay for is lit up in
     gold; one you can't is gray with its price muted; one picked to build
     (tower first, then a square) wears a turquoise ring. */
  .build-bar { margin-top: 10px; }
  .build-how { margin: 0 0 6px; font-size: 13px; line-height: 1.3; color: var(--muted); text-align: center; }
  .build-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .build-row button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 4px 6px; min-width: 0;
    border-radius: 12px; cursor: pointer; font: inherit; line-height: 1.15; color: var(--text);
    background: var(--card); border: 2px solid var(--border);
    transition: opacity 0.25s, border-color 0.25s, box-shadow 0.25s, background-color 0.25s, transform 0.15s;
  }
  .build-row .em { font-size: 26px; line-height: 1.15; transition: filter 0.25s; }
  .build-row .nm { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .build-row .cost { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color 0.25s; }
  .build-row .key { position: absolute; top: 3px; left: 7px; font-size: 10px; font-weight: 800; color: var(--dim); }
  @media (hover: none) { .build-row .key { display: none; } }
  .build-row button.can {
    border-color: var(--accent); background-color: color-mix(in srgb, var(--accent) 16%, var(--card));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .build-row button.can .cost { color: var(--accent); }
  @media (hover: hover) { .build-row button.can:hover { transform: translateY(-2px); } }
  .build-row button.cant { opacity: 0.45; cursor: not-allowed; }
  .build-row button.cant .em { filter: grayscale(1) brightness(0.85); }
  .build-row button.cant .cost { color: var(--dim); font-weight: 700; }
  .build-row button.lit { animation: td-lit 0.9s ease-out; }
  @keyframes td-lit {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 30px var(--accent); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .build-row button.lit { animation: none; } }
  .build-row button[aria-pressed="true"] {
    border-color: var(--pick); background-color: color-mix(in srgb, var(--pick) 18%, var(--card));
    box-shadow: 0 0 0 2px var(--pick), 0 0 18px color-mix(in srgb, var(--pick) 55%, transparent);
  }

  .info { margin-top: 10px; min-height: 92px; }
  .info .hint { margin: 0; }
  .tower-actions button {
    display: flex; align-items: center; gap: 8px; text-align: left; padding: 9px 10px; border-radius: 10px; cursor: pointer;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); font: inherit; font-size: 13px;
  }
  .tower-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tower-head .em { font-size: 28px; }
  .tower-head small { color: var(--dim); display: block; font-size: 12px; }
  .tower-stats { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
  .tower-actions { display: flex; gap: 8px; }
  .tower-actions button { flex: 1; justify-content: center; font-weight: 700; }
  .tower-actions button:disabled { opacity: 0.45; cursor: default; }
  /* On a phone held upright the map gets all the room there is: the page's title steps
     aside while you play, the tips go (the wave button says when wave 1 comes), the
     how-to line is one short line, and a picked tower's card floats over the map
     (towers.js puts it over the half the tower isn't in). The bug-report button would
     sit on the towers, so it waits in the top bar's menu, and the page keeps no empty
     strip at the bottom for it. */
  @media (max-width: 899px) and (orientation: portrait) {
    html:not(.tv) body { padding-bottom: 4px; }
    html:not(.tv) body[data-setup="off"] > header.top { display: none; }
    html:not(.tv) .td-play { position: relative; }
    html:not(.tv) .td-play > .info:not(.on-map) { display: none; }
    html:not(.tv) .td-play > .info.on-map {
      position: absolute; z-index: 5; margin: 0; padding: 10px 12px; min-height: 0; box-sizing: border-box;
      background: color-mix(in srgb, var(--card) 94%, transparent); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }
    html:not(.tv) .fb-corner { display: none; }
    .build-how { font-size: 12px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .build-row { gap: 6px; }
    .build-row button {
      display: grid; grid-template-columns: auto auto; grid-template-areas: "em nm" "em cost";
      justify-content: center; align-items: center; column-gap: 4px; padding: 6px 2px; min-height: 48px;
    }
    .build-row .em { grid-area: em; font-size: 22px; }
    .build-row .nm { grid-area: nm; font-size: 12px; }
    .build-row .cost { grid-area: cost; font-size: 12px; }
    html:not(.tv) .tower-head { margin-bottom: 4px; }
    html:not(.tv) .tower-head .em { font-size: 22px; }
    html:not(.tv) .tower-stats { margin-bottom: 8px; }
  }
  /* A short phone (the browser's bars showing) lets the next wave's list go, so the towers and the card fit. */
  @media (max-width: 600px) and (max-height: 700px) {
    html:not(.tv) .td-play > .next-up { display: none; }
  }
  /* On a computer the map sits on the left, as tall as the screen allows, with the
     score row, the map picker, the wave button and the towers beside it, so nothing scrolls. */
  @media (min-width: 900px), (orientation: landscape) and (max-height: 600px) and (pointer: coarse) {
    html:not(.tv) body {
      max-width: none; padding-left: 0; padding-right: 0; padding-bottom: 0;
      --bar-w: calc(min(1100px, 100vw) - 32px); --gap: 24px; --side: 360px;
      --map-h: clamp(420px, min(calc(100dvh - 128px), calc((var(--bar-w) - var(--gap) - var(--side)) * 13 / 10)), 1000px);
    }
    html:not(.tv) body > header.top { width: var(--bar-w); margin-left: auto; margin-right: auto; box-sizing: border-box; }
    html:not(.tv) .td-play {
      display: grid; width: var(--bar-w); margin: 0 auto 16px; column-gap: var(--gap);
      grid-template-columns: calc(var(--map-h) * 10 / 13 + 4px) minmax(0, 1fr);
      grid-template-rows: auto auto auto auto auto auto auto minmax(0, 1fr);
      grid-template-areas: "map hud" "map opts" "map wave" "map next" "map build" "map info" "map keys" "map .";
    }
    html:not(.tv) .td-play > .stage { grid-area: map; align-self: start; }
    html:not(.tv) .td-play > .hud { grid-area: hud; }
    html:not(.tv) .td-play > .options { grid-area: opts; margin: 0 0 10px; }
    html:not(.tv) .td-play > .wave-bar { grid-area: wave; margin-top: 0; }
    html:not(.tv) .td-play > .next-up { grid-area: next; }
    html:not(.tv) .td-play > .build-bar { grid-area: build; margin-top: 14px; }
    html:not(.tv) .td-play > .info { grid-area: info; }
    html:not(.tv) .td-play > .keys-hint { grid-area: keys; }
  }
  /* A phone turned sideways gets the same map-and-panel layout, sized to the short
     screen, and the page's title row goes (the top bar already says where you are). */
  @media (orientation: landscape) and (max-height: 600px) and (pointer: coarse) {
    /* The map starts just under the top bar and runs to the bottom, so its squares stay big enough to tap. */
    html:not(.tv) body { --side: 300px; --map-h: clamp(200px, calc(var(--app-h, 100dvh) - 66px), 1000px); }
    html:not(.tv) .ah-spacer { height: 64px; }
    html:not(.tv) .td-play > .stage { border-width: 1px; }
    html:not(.tv) body > header.top { display: none; }
    html:not(.tv) .td-play > .keys-hint { display: none; }
    html:not(.tv) .td-play > .hud { gap: 6px; margin: 4px 0 6px; }
    html:not(.tv) .hud div { padding: 3px 8px; }
    html:not(.tv) .hud small { font-size: 9px; }
    html:not(.tv) .hud b { font-size: 15px; }
    html:not(.tv) .td-play > .options { margin-bottom: 6px; }
    html:not(.tv) .map-grid button { padding: 4px; font-size: 12px; }
    html:not(.tv) .next-up { margin-top: 4px; font-size: 12px; }
    /* While the map choices are showing, the list of wave 1's monsters makes room for them. */
    html:not(.tv) body[data-setup="on"] .td-play > .next-up { display: none; }
    html:not(.tv) .td-play > .build-bar { margin-top: 6px; }
    html:not(.tv) .build-how { font-size: 12px; margin-bottom: 4px; }
    html:not(.tv) .build-row { gap: 6px; }
    /* Every tower button the same shape: the picture, with the name over the price beside it. */
    html:not(.tv) .build-row button {
      display: grid; grid-template-columns: auto auto; grid-template-areas: "em nm" "em cost";
      justify-content: center; align-items: center; column-gap: 5px; padding: 4px; min-height: 44px;
    }
    html:not(.tv) .build-row .em { grid-area: em; font-size: 20px; }
    html:not(.tv) .build-row .nm { grid-area: nm; font-size: 11.5px; }
    html:not(.tv) .build-row .cost { grid-area: cost; font-size: 11.5px; }
    /* The tips under the towers would push the side past the bottom; the wave button already says when wave 1 comes. */
    html:not(.tv) .td-play > .info { margin-top: 6px; min-height: 0; padding: 6px 10px; }
    html:not(.tv) .td-play > .info:has(> .hint) { display: none; }
    /* A picked tower's card in two short rows: its name with Upgrade and Sell, then its numbers. */
    html:not(.tv) #info:has(.tower-actions) { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; }
    html:not(.tv) .tower-head { margin: 0; gap: 6px; min-width: 0; }
    html:not(.tv) .tower-head b { font-size: 13px; }
    html:not(.tv) .tower-head .em { font-size: 20px; }
    html:not(.tv) .tower-stats { grid-row: 2; grid-column: 1 / -1; margin: 4px 0 0; font-size: 12px; }
    /* The smallest sideways phones (360 tall) have no room for the tower's description. */
    @media (max-height: 370px) { html:not(.tv) .tower-head small { display: none; } }
    html:not(.tv) .tower-actions { grid-row: 1; grid-column: 2; }
    html:not(.tv) .tower-actions button { min-height: 44px; padding: 4px 10px; flex: 0 0 auto; white-space: nowrap; }
    /* With a tower picked, its card needs the room more than the how-to line does. */
    html:not(.tv) .td-play:has(#info .tower-actions) .build-how { display: none; }
    html:not(.tv) .speed button { width: 44px; height: 44px; }
    /* The bug-report button would sit on the towers; it's in the top bar's menu meanwhile. */
    html:not(.tv) .fb-corner { display: none; }
  }
  /* With the browser's address bar showing too (about 334 tall), the wave button and the gaps get smaller, so a
     picked tower's card fits under the towers without the page scrolling. */
  @media (orientation: landscape) and (max-height: 350px) and (pointer: coarse) {
    html:not(.tv) .td-play { margin-bottom: 0; }
    html:not(.tv) .td-play > .stage { margin-bottom: 0; }
    html:not(.tv) .td-play > .hud { margin: 2px 0 4px; }
    html:not(.tv) .wave-bar .primary { padding-top: 6px; padding-bottom: 6px; }
    html:not(.tv) .td-play > .next-up { margin-top: 2px; }
    html:not(.tv) .td-play > .build-bar { margin-top: 4px; }
    html:not(.tv) .td-play > .info { margin: 4px 0 0; padding: 4px 10px; }
  }
</style>
</head>
<body>
<script src="topbar.js"></script>
<script src="end-window.js"></script>

<header class="top">
  <a href="/" class="icon-btn" title="Back to the arcade">←</a>
  <h1><i class="t-emoji">🏰 </i>TOWER <span>DEFENSE</span></h1>
  <div class="btns">
    <button class="icon-btn" id="pauseBtn" title="Pause (P)">⏸</button>
    <button class="icon-btn" id="muteBtn" title="Sound">🔊</button>
    <button class="icon-btn music-btn" id="musicBtn" title="Music">🎵</button>
    <button class="icon-btn" id="scoresBtn" title="High scores">🏆</button>
    <button class="icon-btn" id="helpBtn" title="How to play">?</button>
  </div>
</header>

<div class="td-play">
<div class="hud" id="hud">
  <div><small>Gold</small><b id="gold">0</b></div>
  <div><small>Lives</small><b id="lives">20</b></div>
  <div><small>Wave</small><b id="wave">0/25</b></div>
  <div><small>Score</small><b id="score">0</b></div>
</div>

<div class="options" id="options">
  <div class="map-grid" id="mapSeg" role="group" aria-label="Map"></div>
</div>

<div class="stage" id="stage">
  <canvas id="canvas" aria-label="The map. Pick an empty square to build a tower there, or a tower to upgrade it."></canvas>
  <div class="stage-msg hidden" id="stageMsg"><b></b><span></span></div>
</div>

<div class="wave-bar">
  <button class="primary" id="waveBtn"><b>▶ Start wave 1</b><small></small><i class="timer"></i></button>
  <div class="speed" role="group" aria-label="Game speed"><small>Speed</small><div><button id="slowerBtn" title="Slower (-)" aria-label="Slower">−</button><b id="speedVal">1×</b><button id="fasterBtn" title="Faster (+)" aria-label="Faster">+</button></div></div>
</div>
<div class="next-up" id="nextUp"></div>
<div class="build-bar" id="buildBar" role="group" aria-label="Towers to build">
  <p class="build-how" id="buildHow"></p>
  <div class="build-row" id="buildRow"></div>
</div>
<div class="panel info" id="info"></div>
<p class="hint center keys-hint">Keyboard: <b>1-4</b> pick a tower, or build it on the picked square · <b>Esc</b> or right-click cancel · <b>U</b> upgrade · <b>S</b> sell · <b>Space</b> call the next wave now · <b>+</b>/<b>−</b> speed · <b>P</b> pause</p>
</div>

<script src="feedback.js"></script>
<script src="avatars.js"></script>
<script src="avatar-photo.js"></script>
<script src="pin-pad.js"></script>
<script src="profile.js"></script>
<script src="custom-media.js"></script>
<script src="stats.js"></script>
<script src="dust-sign.js"></script>
<script src="tutorial.js"></script>
<script src="blip.js"></script>
<script src="arcade-kit.js"></script>
<script src="game-shell.js"></script>
<script src="towers-engine.js"></script>
<script src="towers.js"></script>
<script src="banner.js" defer></script>
</body>
</html>
