<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><title>Rambler</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2740"/><stop offset="1" stop-color="#191726"/></linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#2e9bff"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- the board: 4 x 4 tiles; the ones on the path are lit -->
  <g stroke="#3d3958" stroke-width="1.2">
    <rect x="6" y="6" width="19" height="19" rx="4" fill="url(#lit)"/>
    <rect x="29" y="6" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="52" y="6" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="75" y="6" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="6" y="29" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="29" y="29" width="19" height="19" rx="4" fill="url(#lit)"/>
    <rect x="52" y="29" width="19" height="19" rx="4" fill="url(#lit)"/>
    <rect x="75" y="29" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="6" y="52" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="29" y="52" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="52" y="52" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="75" y="52" width="19" height="19" rx="4" fill="url(#lit)"/>
    <rect x="6" y="75" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="29" y="75" width="19" height="19" rx="4" fill="url(#tile)"/>
    <rect x="52" y="75" width="19" height="19" rx="4" fill="url(#lit)"/>
    <rect x="75" y="75" width="19" height="19" rx="4" fill="url(#tile)"/>
  </g>
  <!-- the word being traced: corner, diagonal, across, diagonal, down-left -->
  <polyline points="15.5,15.5 38.5,38.5 61.5,38.5 84.5,61.5 61.5,84.5" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="15.5" cy="15.5" r="5" fill="#ffd23f"/>
  <circle cx="61.5" cy="84.5" r="6" fill="#2e9bff" stroke="#fff" stroke-width="2"/>
</svg>
